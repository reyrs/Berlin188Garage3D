    <script>
      // Decide before first paint whether the garage-door intro plays, so it
      // never flashes: once per session, never under reduced motion.
      // ?intro replays it, ?nointro skips it.
      (function () {
        var root = document.documentElement;
        var play = true;
        root.classList.add('js');
        try {
          if (sessionStorage.getItem('b188-intro') === '1') play = false;
          else sessionStorage.setItem('b188-intro', '1');
        } catch (e) {}
        if (/[?&]intro\b/.test(location.search)) play = true;
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) play = false;
        if (/[?&]nointro\b/.test(location.search)) play = false;
        root.setAttribute('data-intro', play ? 'play' : 'skip');
      })();
    </script>
